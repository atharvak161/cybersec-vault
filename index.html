<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Vault</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" id="hljs-theme" href="assets/vendor/hljs-dark.min.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <button id="hamburger" class="icon-btn" aria-label="Toggle sidebar" aria-expanded="false">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 5h16M2 10h16M2 15h16"/></svg>
    </button>
    <a href="#/" class="brand"><span class="brand-prompt">&gt;_</span> THE VAULT</a>

    <button id="palette-trigger" class="palette-trigger">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="6"/><path d="M13.5 13.5L18 18" stroke-linecap="round"/></svg>
      <span class="palette-trigger-text">search the vault</span>
      <kbd class="search-kbd">⌘K</kbd>
    </button>

    <div class="topbar-actions">
      <button id="graph-trigger" class="icon-btn" aria-label="Open graph view" title="Graph view">
        <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="5" r="2"/><circle cx="15" cy="6" r="2"/><circle cx="6" cy="15" r="2"/><circle cx="15" cy="15" r="2"/><path d="M6.7 6.3l6.6.9M7 13.3l6.5-6M7.5 6.8l-1 6.4M13.5 8v5"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
        <svg id="theme-icon-sun" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M2 10h2M16 10h2M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
        <svg id="theme-icon-moon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M16.5 12.3A6.8 6.8 0 1 1 7.7 3.5a5.3 5.3 0 0 0 8.8 8.8Z"/></svg>
      </button>
    </div>
  </header>

  <div class="body-row">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-label">tree ~/vault</div>
      <div id="tree" class="tree" aria-label="Notes tree"></div>
    </nav>
    <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>

    <main id="reader" class="reader">
      <section id="landing" class="landing">
        <div class="landing-hero">
          <div class="landing-glyph">&gt;_</div>
          <h1 class="landing-title">THE VAULT</h1>
          <p id="landing-stats" class="landing-stats">loading…</p>
        </div>
        <div id="landing-tracks" class="landing-tracks"></div>
      </section>

      <article id="note-view" class="note-view" hidden>
        <nav id="breadcrumb" class="breadcrumb"></nav>
        <h1 id="note-title" class="note-title"></h1>
        <div id="note-tags" class="note-tags"></div>
        <div id="note-body" class="note-body"></div>

        <section id="backlinks" class="backlinks" hidden>
          <div class="section-label">// linked mentions</div>
          <div id="backlinks-list" class="backlinks-list"></div>
        </section>
      </article>
    </main>

    <aside id="right-rail" class="right-rail" hidden>
      <div class="rail-block">
        <div class="sidebar-label">on this page</div>
        <nav id="toc" class="toc"></nav>
      </div>
      <div class="rail-block">
        <div class="sidebar-label">local graph</div>
        <canvas id="local-graph" width="240" height="200"></canvas>
      </div>
    </aside>
  </div>

  <!-- Command palette -->
  <div id="palette" class="palette" hidden>
    <div id="palette-backdrop" class="palette-backdrop"></div>
    <div class="palette-box" role="dialog" aria-label="Search the vault">
      <div class="palette-input-row">
        <span class="palette-prompt">&gt;</span>
        <input id="search-input" class="palette-input" type="text" placeholder="search the vault" autocomplete="off" spellcheck="false" />
        <span class="palette-cursor"></span>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- Global graph view -->
  <div id="graph-view" class="graph-view" hidden>
    <div class="graph-view-header">
      <span class="graph-view-title">graph view <span class="graph-view-sub">// 248 notes, all tracks</span></span>
      <button id="graph-close" class="icon-btn" aria-label="Close graph view">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <canvas id="global-graph" class="global-graph-canvas"></canvas>
  </div>
</div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/highlight.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
